openapi: 3.0.0
info:
  title: GoWatchIt Configuration API
  version: 0.0.0
tags: []
paths:
  /config:
    get:
      operationId: ConfigAPI_getConfig
      description: Get the complete application configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
    put:
      operationId: ConfigAPI_updateConfig
      description: Update the complete application configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfig'
  /config/authors:
    get:
      operationId: ConfigAPI_getAuthors
      description: Get available BEQ authors from catalogue
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /config/ezbeq:
    get:
      operationId: ConfigAPI_getEzbeqConfig
      description: Get EzBEQ configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EZBEQConfig'
  /config/hdmi-sync:
    get:
      operationId: ConfigAPI_getHdmiSyncConfig
      description: Get HDMI sync configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HDMISyncConfig'
  /config/homeassistant:
    get:
      operationId: ConfigAPI_getHaConfig
      description: Get Home Assistant configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeAssistantConfig'
  /config/player:
    get:
      operationId: ConfigAPI_getPlayerConfig
      description: Get player configuration
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerConfig'
components:
  schemas:
    AppConfig:
      type: object
      required:
        - ezbeq
        - homeAssistant
        - player
        - hdmiSync
      properties:
        ezbeq:
          allOf:
            - $ref: '#/components/schemas/EZBEQConfig'
          description: EzBEQ integration settings
        homeAssistant:
          allOf:
            - $ref: '#/components/schemas/HomeAssistantConfig'
          description: Home Assistant integration settings
        player:
          allOf:
            - $ref: '#/components/schemas/PlayerConfig'
          description: Media player settings
        hdmiSync:
          allOf:
            - $ref: '#/components/schemas/HDMISyncConfig'
          description: HDMI sync settings
      description: Complete application configuration
    EZBEQConfig:
      type: object
      required:
        - enabled
        - url
        - port
        - scheme
        - avrBrand
        - avrURL
        - denonIP
        - denonPort
        - preferredAuthors
        - slots
        - useAVRCodecSearch
        - adjustMasterVolumeWithProfile
        - enableTVBEQ
        - looseEditionMatching
        - skipEditionMatching
        - stopPlexIfMismatch
        - notifyOnLoad
        - notifyOnUnload
        - dryRun
      properties:
        id:
          type: integer
          format: int64
          description: Database ID (internal use only)
          readOnly: true
        enabled:
          type: boolean
          description: Enable EzBEQ integration
          default: false
        url:
          type: string
          pattern: ^[a-z0-9.-]+$|^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$
          description: EzBEQ server hostname or IP address
          example: ezbeq.local
          default: ezbeq.local
        port:
          type: string
          description: EzBEQ server port
          example: '8080'
          default: '8080'
        scheme:
          type: string
          enum:
            - http
            - https
          description: Connection protocol
          default: http
        avrBrand:
          type: string
          enum:
            - Denon
            - Marantz
          description: AVR brand
          example: Denon
          default: Denon
        avrURL:
          type: string
          pattern: ^https?://
          description: AVR URL with protocol
          example: http://192.168.1.100
          default: ''
        denonIP:
          type: string
          pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$|^[a-z0-9.-]+$
          description: Denon AVR IP address
          example: 192.168.1.100
          default: ''
        denonPort:
          type: string
          description: Denon AVR port
          example: '23'
          default: '23'
        preferredAuthors:
          type: array
          items:
            type: string
          description: Preferred BEQ authors. Select authors to allow. Leave empty to match any author
          default: []
        slots:
          type: array
          items:
            type: integer
            format: int32
          minItems: 0
          maxItems: 4
          description: Profile slot numbers to load into
          default: []
        useAVRCodecSearch:
          type: boolean
          description: Use AVR codec search for BEQ profiles
          default: false
        adjustMasterVolumeWithProfile:
          type: boolean
          description: Adjust master volume with profile
          default: true
        enableTVBEQ:
          type: boolean
          description: Enable TV BEQ profiles
          default: false
        looseEditionMatching:
          type: boolean
          description: Match ANY edition IF your client sends a blank edition
          default: false
        skipEditionMatching:
          type: boolean
          description: Skip edition matching entirely
          default: false
        stopPlexIfMismatch:
          type: boolean
          description: Stop Plex playback if BEQ profile doesn't match
          default: false
        notifyOnLoad:
          type: boolean
          description: Send notification when profile is loaded
          default: false
        notifyOnUnload:
          type: boolean
          description: Send notification when profile is unloaded
          default: false
        dryRun:
          type: boolean
          description: Enable dry run mode (no actual changes)
          default: false
      description: EzBEQ integration configuration
    HDMISyncConfig:
      type: object
      required:
        - enabled
        - source
        - time
        - envy
        - playerIP
        - playerMachineIdentifier
        - scheme
      properties:
        id:
          type: integer
          format: int64
          description: Database ID (internal use only)
          readOnly: true
        enabled:
          type: boolean
          description: Enable HDMI sync
          default: false
        source:
          type: string
          description: HDMI source input
          example: HDMI1
          default: ''
        time:
          type: string
          description: Sync timing in milliseconds
          example: '500'
          default: '500'
        envy:
          type: string
          description: Envy device identifier
          default: ''
        playerIP:
          type: string
          pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$
          description: Media player IP address
          example: 192.168.1.50
          default: ''
        playerMachineIdentifier:
          type: string
          description: Media player machine identifier
          example: abc123def456
          default: ''
        scheme:
          type: string
          enum:
            - http
            - https
          description: Connection protocol
          default: http
      description: HDMI sync configuration
    HomeAssistantConfig:
      type: object
      required:
        - enabled
        - url
        - port
        - scheme
        - token
        - remoteEntityName
        - notifyEndpointName
        - notifyDisplayTime
        - triggerAspectRatioChangeOnEvent
      properties:
        id:
          type: integer
          format: int64
          description: Database ID (internal use only)
          readOnly: true
        enabled:
          type: boolean
          description: Enable Home Assistant integration
          default: false
        url:
          type: string
          pattern: ^[a-z0-9.-]+$|^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$
          description: Home Assistant URL
          example: homeassistant.local
          default: ''
        port:
          type: string
          description: Home Assistant port
          example: '8123'
          default: '8123'
        scheme:
          type: string
          enum:
            - http
            - https
          description: Connection protocol
          default: http
        token:
          type: string
          format: password
          description: Home Assistant authentication token
          default: ''
        remoteEntityName:
          type: string
          description: Remote entity name in Home Assistant
          example: remote.shield_tv
          default: ''
        notifyEndpointName:
          type: string
          description: Notification endpoint name
          example: notify.tv
          default: ''
        notifyDisplayTime:
          type: integer
          format: int32
          minimum: 1000
          maximum: 30000
          description: Notification display time in milliseconds
          default: 5000
        triggerAspectRatioChangeOnEvent:
          type: boolean
          description: Trigger aspect ratio change on media events
          default: false
      description: Home Assistant integration configuration
    Player:
      type: string
      enum:
        - Plex
        - Jellyfin
        - HomeAssistant
      description: Supported media player types
    PlayerConfig:
      type: object
      required:
        - enabled
        - url
        - port
        - scheme
        - playerType
        - token
        - userID
        - deviceUUIDFilter
        - ownerNameFilter
        - skipTMDB
        - mediaEntityName
      properties:
        id:
          type: integer
          format: int64
          description: Database ID (internal use only)
          readOnly: true
        enabled:
          type: boolean
          description: Enable player integration
          default: false
        url:
          type: string
          pattern: ^[a-z0-9.-]+$|^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$
          description: Media player URL
          example: plex.local
          default: ''
        port:
          type: string
          description: Media player port
          example: '32400'
          default: '32400'
        scheme:
          type: string
          enum:
            - http
            - https
          description: Connection protocol
          default: http
        playerType:
          allOf:
            - $ref: '#/components/schemas/Player'
          description: Type of media player
          default: Plex
        token:
          type: string
          format: password
          description: Authentication token for the media player
          default: ''
        userID:
          type: string
          description: User ID for players that require it
          example: '123456789'
          default: ''
        deviceUUIDFilter:
          type: string
          description: Filter by device UUID (comma-separated for multiple)
          example: abc123,def456
          default: ''
        ownerNameFilter:
          type: string
          description: Filter by owner name
          example: John Doe
          default: ''
        skipTMDB:
          type: boolean
          description: Skip TMDB metadata lookup (Jellyfin only)
          default: false
        mediaEntityName:
          type: string
          description: Media entity name (Home Assistant only)
          example: media_player.living_room
          default: ''
      description: Media player configuration
servers:
  - url: http://localhost:8080
    description: Development server
    variables: {}
